<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HexMe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--bg:#f6f5f2;--fg:#1c1b1a;--mut:#6d6a66;--line:#dcd9d3;--card:#fff;--c:#888;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161514;--fg:#f1efeb;--mut:#a09b94;--line:#33312e;--card:#201f1d}}
:root[data-theme="dark"]{--bg:#161514;--fg:#f1efeb;--mut:#a09b94;--line:#33312e;--card:#201f1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:22px 20px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:800;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--c);transition:background .6s}
h1{font-size:clamp(34px,9vw,52px);font-weight:800;line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}
.lead{color:var(--mut);margin:0 0 24px;max-width:46ch}
.drop{display:block;border:2px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;cursor:pointer;background:var(--card)}
.drop:focus-within,.drop:hover{border-color:var(--fg)}
.drop b{display:block;font-size:18px}
.drop span{color:var(--mut);font-size:14px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.thumbs img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.note{color:var(--mut);font-size:13px;margin:12px 0 0}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 22px;background:var(--fg);color:var(--bg);cursor:pointer;margin-top:16px}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,.drop:focus-within{outline:3px solid var(--c);outline-offset:2px}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.lang{margin:0;padding:6px 12px;font-size:13px}
.rng{display:none;gap:10px;align-items:end;flex-wrap:wrap;margin-top:14px}
.rng label{font-size:13px;color:var(--mut);display:block}
.rng input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.rng .note{flex-basis:100%;margin:0}
.chk{flex-basis:100%;display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer;color:var(--fg)}
.rng .chk input{width:18px;height:18px;padding:0;border:0;background:none;accent-color:var(--c)}
#dd{display:none;gap:10px;align-items:end;flex-wrap:wrap;flex-basis:100%}
#dd.on{display:flex}
#res{display:none;margin-top:36px}
.hero>*{position:relative;z-index:1}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px 28px;color:#fff;background:radial-gradient(120% 80% at 50% 0%,#24212f 0%,#0f0e15 72%);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 24px 60px -28px var(--c1)}
.stage{position:relative;width:min(250px,68%);aspect-ratio:1;margin:6px 0 16px;animation:bob 5s ease-in-out infinite alternate}
.aura{position:absolute;inset:-18%;background:radial-gradient(circle,var(--c1) 0%,transparent 62%);filter:blur(22px);opacity:.5;animation:breathe 4s ease-in-out infinite alternate}
#gem{display:none}#gem3{position:relative;width:100%;height:100%;display:block}
.hero.in #gem3{animation:gempop 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes bob{to{transform:translateY(-7px)}}
@keyframes breathe{from{opacity:.32;transform:scale(.94)}to{opacity:.62;transform:scale(1.06)}}
@keyframes gempop{from{opacity:0;transform:scale(.55) rotate(-40deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.stage,.aura,.hero.in #gem3,.circ i{animation:none}}
.fh{font-weight:800;font-size:20px;margin:28px 0 10px}
.fc{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.hxi{flex:none;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.fc i{display:block;font-style:normal;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fc b{display:block;font-size:17px}
.fc small{display:block;color:var(--mut);font-size:13px;line-height:1.35;margin-top:2px}
.cp{margin-top:8px;font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.pm{margin:18px 0 0;padding:20px;border-radius:20px;background:#0f0e15;color:#fff;border:1px solid rgba(255,255,255,.08)}
.pm h3{margin:0 0 12px;font-size:20px;font-weight:800}
.pm p{margin:0 0 14px;font-size:18px;line-height:1.55;font-style:italic;white-space:pre-line}
.pm .cp{color:#fff;border-color:rgba(255,255,255,.25);margin:0 8px 0 0}
.duo{display:flex;align-items:center;gap:18px;margin:22px 0 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.circ{position:relative;width:86px;height:58px;flex:none}
.circ i{position:absolute;top:1px;width:56px;height:56px;border-radius:50%;animation:pulse 3.4s ease-in-out infinite alternate}
.circ i:nth-child(1){left:0;background:var(--m)}
.circ i:nth-child(2){left:30px;background:var(--a);animation-delay:1.1s}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.08)}}
.dt{font-weight:800}
.duo b{display:block}
.duo span{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.duo small{display:block;color:var(--mut);font-size:13px;margin-top:2px;line-height:1.35}
@keyframes pop{from{opacity:0;transform:scale(.88);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
@keyframes shine{to{transform:translateX(120%)}}
.wm{font-weight:800;font-size:15px;align-self:flex-start}
.hero small{opacity:.8;font-size:14px}
.hero h2{font-size:clamp(30px,8vw,44px);font-weight:800;margin:4px 0 8px;line-height:1.05;letter-spacing:-.02em;min-height:1.1em}
.code{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;display:inline-block;letter-spacing:.04em}
.rgb{opacity:.85;font-size:14px}
.pal{display:flex;height:46px;border-radius:12px;overflow:hidden;margin:20px 0 6px}
.pal div{min-width:2px;transform-origin:left;animation:grow 1s .6s both cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
h3{font-size:18px;margin:28px 0 10px}
.m{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.strip{display:flex;width:60px;height:38px;border-radius:9px;overflow:hidden;flex:none}
.strip i{flex:1}
.m a{color:inherit;text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:2px;text-underline-offset:3px}
.m a::after{content:" ↗";font-size:.8em;color:var(--mut)}
.m b{display:block}
.m span{color:var(--mut);font-size:13px}
.m em{margin-left:auto;font-style:normal;font-weight:600}
.fine{color:var(--mut);font-size:12px;margin-top:22px}
#ov{position:fixed;inset:0;background:#0d0c0b;display:none;z-index:9;align-items:flex-end;justify-content:center}
#ov canvas{position:absolute;inset:0;width:100%;height:100%}
#ov p{position:relative;color:#eee;font-weight:600;padding-bottom:12vh;margin:0}

.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button.wp{margin:0;padding:0;background:none;color:var(--fg);text-align:left;text-transform:none;letter-spacing:0}
.wp canvas{width:100%;aspect-ratio:1170/2532;display:block;background:#111}
.wp span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:6px}
#wo{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.94);flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#fff}
.woi img,.woi video{max-height:72vh;max-width:90vw;display:block}
#wo p{margin:0;font-size:13px;opacity:.7}
.wob{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#wo button,#wo a.bt{margin:0;border-radius:0;padding:14px 20px;background:#fff;color:#0a0a0a;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;border:2px solid #fff}
#wo button.alt{background:transparent;color:#fff}
/* Japandi: washi paper, soft earth tones, serif headings, generous space */
:root{--bg:#f3efe7;--fg:#2c2a26;--mut:#8b8478;--line:#ddd6c9;--card:#faf7f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--fg:#ece6da;--mut:#9b9388;--line:#38342f;--card:#242120}}
:root[data-theme="dark"]{--bg:#1c1a18;--fg:#ece6da;--mut:#9b9388;--line:#38342f;--card:#242120}
body{font-family:Manrope,"Noto Sans",system-ui,sans-serif;letter-spacing:0;line-height:1.7}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .25 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
main{position:relative;z-index:1;max-width:620px;padding:28px 24px 80px}
h1,.hero h2,h3,.fh,.drop b,.fc b,.duo .dt,.pm p{font-family:"Cormorant Garamond","Noto Serif",Georgia,serif}
.top{border:0;margin-bottom:34px;padding:0}
.brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.06em}.brand i{border-radius:50%}
h1{font-size:clamp(42px,11.5vw,66px);font-weight:500;line-height:1.02;letter-spacing:-.01em;margin:0 0 18px}
.lead{color:var(--mut);font-size:16px;max-width:38ch;margin-bottom:34px}
.drop{border:1px dashed var(--mut);border-radius:26px;background:var(--card);text-align:center;padding:40px 20px}
.drop b{font-size:26px;font-weight:500;letter-spacing:0}.drop b::after{content:""}
.drop:hover,.drop:focus-within{background:var(--card);color:var(--fg);padding-left:20px;border-color:var(--fg)}
.drop span{color:var(--mut)}
.snap{display:block;text-align:center;margin-top:12px;padding:14px 20px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-weight:600}
.snap:hover,.snap:focus-within{border-color:var(--fg)}
button,#go{border-radius:999px;padding:14px 28px;font-size:15px;font-weight:600;text-transform:none;letter-spacing:.01em}
#go{width:auto;min-width:220px}
button.alt{border:1px solid var(--line);background:transparent;color:var(--fg)}
.rng input{border:1px solid var(--line);border-radius:12px}
h3,.fh{font-size:26px;font-weight:500;text-transform:none;letter-spacing:0;border:0;padding:0;margin:64px 0 14px}
.hero{align-items:center;text-align:center;border:0;border-radius:32px;background:radial-gradient(120% 80% at 50% 0%,#3a352f 0%,#201d1a 78%);box-shadow:0 34px 60px -38px rgba(44,32,20,.55);padding:26px 22px 36px}
.stage{margin:10px 0 24px}
.hero h2{font-size:clamp(46px,13vw,68px);font-weight:500;letter-spacing:-.01em;line-height:1}
.emf{font-size:12.5px;letter-spacing:.04em;color:rgba(255,255,255,.55);margin:-8px 0 14px}.emf:empty{display:none}
.emo{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;line-height:1.3;color:rgba(255,255,255,.82);margin:10px 0 14px;max-width:30ch}
.hero .code{font-size:26px;font-weight:500;letter-spacing:.16em}
.duo,.fc{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:18px 20px;margin:0 0 10px}
.duo{margin-top:30px}
.fc b,.duo .dt{font-size:23px;font-weight:500;letter-spacing:0;line-height:1.12;margin:2px 0 4px}
.duo b,.m b,.fbn b,h3,.fh,.drop b,.sr b,.smr b,.wg b,.sin h2,.sfin h2{line-height:1.12}
.fc small,.duo small{line-height:1.4}
.fc i{font-size:11px;font-weight:600;letter-spacing:.16em}
.pm{border:0;border-radius:28px;background:#26231f;padding:26px 24px;margin-top:22px}
.pm p{font-size:23px;line-height:1.6;font-style:italic;font-weight:500}
.pm h3{font-size:15px;font-family:Manrope,sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:0 0 14px}
.pal{border-radius:20px;overflow:hidden}
.mu{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.mub{margin:0;background:#f3efe7;color:#26231f;padding:11px 20px;font-size:14px}
.hero .mu{justify-content:center;margin:20px 0 0}
.sl .sr>i{width:58px;height:58px;margin-top:0}.sl .sr{align-items:center}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.wg figure{margin:0;text-align:center}.wg canvas{width:100%;max-width:170px;aspect-ratio:1;display:block;margin:0 auto 8px}
.wg b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:500;line-height:1.15}.wg span{display:block;font-size:12px;opacity:.55;letter-spacing:.08em;text-transform:uppercase}
.sl.on .wg figure{animation:up .6s both}.sl.on .wg figure:nth-child(2){animation-delay:.12s}.sl.on .wg figure:nth-child(3){animation-delay:.24s}.sl.on .wg figure:nth-child(4){animation-delay:.36s}
.mic{width:56px;height:56px;flex:none}.smr .mic{width:72px;height:72px}
button.why{display:inline-flex;align-items:center;gap:14px;margin:-12px 0 30px;padding:7px 22px 7px 7px;background:transparent;color:var(--fg);border:1.5px solid var(--mut);font-size:15px;text-align:left;transition:border-color .3s}button.why:hover{border-color:var(--fg)}
button.why .pl{position:relative;width:40px;height:40px;flex:none;display:grid;place-items:center}
button.why .pl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#E0793D,#D1507F,#7A5A8C,#3AA7C9,#58C4A8,#E9A23B,#E0793D);animation:spin 7s linear infinite}
button.why .pl::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--fg);opacity:0;animation:halo 2.4s ease-out infinite}
button.why .pl b{position:relative;width:28px;height:28px;border-radius:50%;background:var(--fg);display:grid;place-items:center;font-size:11px;padding-left:2px;color:var(--bg)}
button.why small{display:block;font-size:12px;font-weight:500;opacity:.6;margin-top:1px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes halo{0%{opacity:.5;transform:scale(.9)}100%{opacity:0;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){button.why .pl::before,button.why .pl::after{animation:none}}
.sin h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:clamp(34px,9.5vw,50px);line-height:1.08;margin:0 0 18px}
.sin p{font-size:17px;line-height:1.6;opacity:.78;margin:0 0 22px;max-width:30ch}
.shx{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 26px}.shx i{width:46px;height:46px;border-radius:50%;animation:bob 3s ease-in-out infinite alternate}
.shx i:nth-child(2){animation-delay:.4s}.shx i:nth-child(3){animation-delay:.8s}.shx i:nth-child(4){animation-delay:1.2s}.shx i:nth-child(5){animation-delay:1.6s}
.inr{display:flex;gap:10px;margin:0 0 24px;flex-wrap:wrap}.inr i{width:64px;height:64px;border-radius:50%;background:center/cover no-repeat;flex:none;box-shadow:0 10px 24px -14px #000;animation:up .6s both}
.inr i:nth-child(2){animation-delay:.1s}.inr i:nth-child(3){animation-delay:.2s}.inr i:nth-child(4){animation-delay:.3s}
.inr.big i{width:84px;height:84px}.inr.one i{width:120px;height:120px}
.inpk{margin:0 0 22px}.inpb{width:96px;height:96px;border-radius:50%;background:var(--pc);box-shadow:0 0 50px -6px var(--pc);margin:0 0 16px;animation:up .6s both}
.inps{display:flex;gap:9px;margin:0 0 16px}.inps i{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.14);animation:up .6s both}.inps i.on{border-color:#fff;transform:scale(1.15)}
.inpr{position:relative;height:10px;border-radius:6px;margin:0 0 12px;max-width:240px;background:linear-gradient(90deg,#e74323,#f2c12e,#3fbf5f,#2fb4d6,#3a5be0,#c14fd6,#e74323)}.inpr.s{background:linear-gradient(90deg,#8c7a74,#ff3d12)}
.inpr b{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid #1d1a17}
.inr.feed{display:grid;grid-template-columns:repeat(3,58px);gap:8px;filter:grayscale(.85) brightness(.75);opacity:.75;transform:rotate(-4deg)}.inr.feed i{width:58px;height:58px;border-radius:12px}
.ingem{display:block;width:140px;height:140px;margin:0 0 22px;animation:bob 4s ease-in-out infinite alternate}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}.chips span{padding:8px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;font-size:14px}
/* stories */
.st{position:fixed;inset:0;z-index:40;background:#1d1a17;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(env(safe-area-inset-bottom,0px) + 10px)}
.st[hidden]{display:none}
.st::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 55% at 50% 22%,var(--scg),transparent 72%);pointer-events:none;transition:background 1s}
.stbar{position:relative;z-index:2;display:flex;gap:6px;align-items:center;padding:0 12px 0 16px;max-width:520px;width:100%;margin:0 auto}
.stp{flex:1;display:flex;gap:4px}.stp i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22)}.stp i.on{background:rgba(255,255,255,.9)}
.stic{margin:0;padding:8px 10px;background:transparent;color:#fff;border:0;border-radius:999px;font-size:17px;line-height:1}
.sts{position:relative;z-index:1;flex:1;width:100%;max-width:520px;margin:0 auto;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
.sl{position:absolute;inset:0;padding:20px 26px 12px;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .45s,transform .45s,visibility .45s}
.sl.on{opacity:1;visibility:visible;transform:none}.sl.past{transform:translateX(-28px)}
.sl h4{font-family:Manrope,sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin:0 0 22px;font-weight:600}
.sl .hero{background:none;box-shadow:none;padding:0;border-radius:0}.sl .hero .wm{display:none}
.sl{justify-content:flex-start}.sl>*,.hero>*{flex-shrink:0}.sl>:first-child{margin-top:auto}.sl>:last-child{margin-bottom:auto}
.sl .stage{width:min(230px,58%,30vh)}
@media (max-height:760px){.sl .stage{width:min(170px,24vh);margin:0 0 14px}.sl .hero h2{font-size:clamp(36px,10.5vw,50px)}.sl .emo{font-size:20px;margin:8px 0 10px}.sl .hero .code{font-size:22px}.sl .hero .mu{margin-top:14px}}.sl #rgb,.sl #sim{display:none}
.spo{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(26px,7.4vw,36px);line-height:1.45;margin:0;white-space:pre-line}
.sr{display:flex;gap:16px;align-items:flex-start;margin:0 0 20px}.sr>i{width:30px;height:30px;flex:none;margin-top:8px;border-radius:50%}
.sr small{display:block;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;opacity:.55}
